    <text x="36" y="410" fill="#ffffff" font-family="'Playfair Display', serif, system-ui" font-size="38" font-weight="700" letter-spacing="-1">Recovery</text>

    <text x="36" y="445" fill="rgba(242,236,209,0.75)" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="400">
