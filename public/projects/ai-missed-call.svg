  <rect width="800" height="800" fill="url(#grid)" />

  <circle cx="630" cy="190" r="160" fill="#e07a1f" opacity="0.12" filter="blur(40px)" />

  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="680" height="680" rx="24" fill="rgba(25,12,2,0.6)" stroke="rgba(242,236,209,0.18)" stroke-width="1.5" />
    
    <g transform="translate(36, 40)">
      <rect width="168" height="32" rx="16" fill="rgba(224,122,31,0.15)" stroke="#e07a1f" stroke-width="1" />
      <text x="84" y="21" fill="#f59e42" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">AI / AUTOMATION</text>
