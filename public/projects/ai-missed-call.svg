      <path d="M 30 100 Q 60 20 90 100 T 150 100 T 210 100 T 270 100" fill="none" stroke="#f59e42" stroke-width="2" stroke-dasharray="4 4"/>
      <circle cx="90" cy="100" r="6" fill="#f59e42" />
      <circle cx="150" cy="100" r="6" fill="#f59e42" />
      <circle cx="210" cy="100" r="6" fill="#f59e42" />
