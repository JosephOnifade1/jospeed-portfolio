    </text>

    <g transform="translate(36, 480)">
      <rect width="360" height="54" rx="12" fill="rgba(0,0,0,0.4)" stroke="rgba(34,197,94,0.3)" stroke-width="1" />
      <circle cx="24" cy="27" r="5" fill="#22c55e" />
      <text x="38" y="33" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">10x Faster Inference via Groq</text>
    </g>

