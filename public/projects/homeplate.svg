<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0906" />
      <stop offset="50%" stop-color="#3d1c10" />
      <stop offset="100%" stop-color="#5a2e1c" />
    </linearGradient>
    <radialGradient id="glow" cx="65%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(242,236,209,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="800" fill="url(#bg)" />
  <rect width="800" height="800" fill="url(#glow)" />
  <rect width="800" height="800" fill="url(#grid)" />

  <circle cx="640" cy="180" r="160" fill="#ea580c" opacity="0.12" filter="blur(40px)" />

  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="680" height="680" rx="24" fill="rgba(20,8,6,0.6)" stroke="rgba(242,236,209,0.18)" stroke-width="1.5" />
    
    <g transform="translate(36, 40)">
      <rect width="130" height="32" rx="16" fill="rgba(234,88,12,0.15)" stroke="#ea580c" stroke-width="1" />
      <text x="65" y="21" fill="#fb923c" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">WEB APPS</text>
    </g>

    <g transform="translate(480, 40)">
      <rect width="164" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <text x="82" y="21" fill="#f2ecd1" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">PAYSTACK ROUTING</text>
    </g>

    <!-- Marketplace / plate graphic -->
    <g transform="translate(36, 120)">
      <circle cx="100" cy="100" r="70" fill="none" stroke="rgba(234,88,12,0.3)" stroke-width="3" />
      <circle cx="100" cy="100" r="45" fill="none" stroke="#ea580c" stroke-width="2" />
      <path d="M 60 70 L 140 70 M 60 100 L 140 100 M 60 130 L 140 130" stroke="rgba(251,146,60,0.4)" stroke-width="2" />
      <circle cx="160" cy="150" r="10" fill="#fb923c" />
    </g>

    <text x="36" y="380" fill="#ffffff" font-family="'Playfair Display', serif, system-ui" font-size="58" font-weight="800" letter-spacing="-1">HomePlate</text>

    <text x="36" y="420" fill="rgba(242,236,209,0.75)" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
      Low-Bandwidth Multi-Currency Marketplace
    </text>

    <g transform="translate(36, 460)">
      <rect width="360" height="54" rx="12" fill="rgba(0,0,0,0.4)" stroke="rgba(234,88,12,0.3)" stroke-width="1" />
      <circle cx="24" cy="27" r="5" fill="#ea580c" />
      <text x="38" y="33" fill="#fb923c" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">100% Native African Payments</text>
    </g>

    <g transform="translate(36, 560)">
      <g transform="translate(0, 0)">
        <rect width="84" height="34" rx="8" fill="rgba(242,236,209,0.08)" stroke="rgba(242,236,209,0.2)" stroke-width="1"/>
        <text x="42" y="22" fill="#f2ecd1" font-family="'JetBrains Mono', monospace" font-size="13" text-anchor="middle">React</text>
      </g>
      <g transform="translate(94, 0)">
        <rect width="102" height="34" rx="8" fill="rgba(242,236,209,0.08)" stroke="rgba(242,236,209,0.2)" stroke-width="1"/>
        <text x="51" y="22" fill="#f2ecd1" font-family="'JetBrains Mono', monospace" font-size="13" text-anchor="middle">Supabase</text>
      </g>
      <g transform="translate(206, 0)">
        <rect width="102" height="34" rx="8" fill="rgba(242,236,209,0.08)" stroke="rgba(242,236,209,0.2)" stroke-width="1"/>
        <text x="51" y="22" fill="#f2ecd1" font-family="'JetBrains Mono', monospace" font-size="13" text-anchor="middle">Paystack</text>
      </g>
      <g transform="translate(318, 0)">
        <rect width="144" height="34" rx="8" fill="rgba(242,236,209,0.08)" stroke="rgba(242,236,209,0.2)" stroke-width="1"/>
        <text x="72" y="22" fill="#f2ecd1" font-family="'JetBrains Mono', monospace" font-size="13" text-anchor="middle">Multi-Currency</text>
      </g>
    </g>
  </g>
</svg>
